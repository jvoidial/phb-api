name: CAT-EOF-PHB-TRIGGER

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  trigger-voidai:
    runs-on: ubuntu-latest

    steps:
    - name: CAT EOF • Trigger VOIDAI Sync Build
      run: |
        curl -X POST \
        -H "Accept: application/vnd.github+json" \
        -H "Authorization: Bearer ${{ secrets.GH_PAT }}" \
        https://api.github.com/repos/jvoidial/void-ai-apk/actions/workflows/voidai_sync.yml/dispatches \
        -d '{"ref":"main"}'

